name: Build static site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout website content
        uses: actions/checkout@v4
        with:
          repository: solielkeisen/Ravi.me-content
          ref: main
          path: content
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static pages
        run: CONTENT_DIR=content node make

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "chore: regenerate static site from markdown posts"
            git push
          }